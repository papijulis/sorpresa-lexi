  <text x="560" y="290" font-family="DejaVu Serif, Georgia, serif" font-size="88" font-weight="700" fill="#FFD700" opacity="0.9">Para Lexi</text>
  <text x="564" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#E9D5FF">Un pequeño mundo hecho de flores amarillas,</text>
